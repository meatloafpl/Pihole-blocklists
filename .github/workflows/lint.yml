name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tldextract pytest

      - name: Run tests
        working-directory: scripts
        run: pytest test_main.py -v

      - name: Check captured for dead domains
        run: |
          echo "Checking DNS resolution for domains in captured..."
          nxdomain=0
          unresolved=0

          while IFS= read -r domain || [[ -n "$domain" ]]; do
            [[ -z "$domain" || "$domain" == \#* ]] && continue

            output=$(host "$domain" 1.1.1.1 2>&1) || true

            if echo "$output" | grep -q "3(NXDOMAIN)"; then
              # Confirm on a second, independent resolver before treating as dead —
              # a single resolver's NXDOMAIN can be network-dependent (see incident
              # where 1.1.1.1-from-CI disagreed with a local check).
              output2=$(host "$domain" 8.8.8.8 2>&1) || true
              if echo "$output2" | grep -q "3(NXDOMAIN)"; then
                echo "::error::NXDOMAIN on 1.1.1.1 and 8.8.8.8 (dead): $domain"
                nxdomain=$((nxdomain + 1))
              else
                echo "::warning::NXDOMAIN on 1.1.1.1 but not confirmed on 8.8.8.8, needs manual review: $domain"
                unresolved=$((unresolved + 1))
              fi
            elif ! echo "$output" | grep -q "has address\|has IPv6 address\|is an alias"; then
              # SERVFAIL, timeout, or any other non-conclusive result.
              # This does NOT mean the domain is dead — see check_captured.py
              # for why TIMEOUT is treated separately from NXDOMAIN.
              echo "::warning::unresolved, needs manual review (not necessarily dead): $domain"
              unresolved=$((unresolved + 1))
            fi
          done < captured

          echo ""
          echo "Summary: $nxdomain confirmed NXDOMAIN (2 resolvers agree), $unresolved unresolved (review manually)."
          if [ "$unresolved" -gt 0 ]; then
            echo "Unresolved entries are informational only — do not fail this check."
          fi
          if [ "$nxdomain" -gt 0 ]; then
            echo "::error::$nxdomain domain(s) in captured are confirmed dead (NXDOMAIN on both 1.1.1.1 and 8.8.8.8)."
            echo "Run 'python scripts/check_captured.py' locally to confirm and clean up, then push a fix."
            exit 1
          fi