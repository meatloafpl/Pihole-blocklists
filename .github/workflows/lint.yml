name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tldextract pytest

      - name: Run tests
        working-directory: scripts
        run: pytest test_main.py -v

      - name: Check captured for dead domains
        run: |
          echo "Checking DNS resolution for domains in captured..."
          nxdomain=0
          unresolved=0

          while IFS= read -r domain || [[ -n "$domain" ]]; do
            [[ -z "$domain" || "$domain" == \#* ]] && continue

            output=$(host "$domain" 1.1.1.1 2>&1)

            if echo "$output" | grep -q "3(NXDOMAIN)"; then
              echo "::warning::NXDOMAIN (likely dead): $domain"
              nxdomain=$((nxdomain + 1))
            elif ! echo "$output" | grep -q "has address\|has IPv6 address\|is an alias"; then
              # SERVFAIL, timeout, or any other non-conclusive result.
              # This does NOT mean the domain is dead — see check_captured.py
              # for why TIMEOUT is treated separately from NXDOMAIN.
              echo "::warning::unresolved, needs manual review (not necessarily dead): $domain"
              unresolved=$((unresolved + 1))
            fi
          done < captured

          echo ""
          echo "Summary: $nxdomain confirmed NXDOMAIN, $unresolved unresolved (review manually)."
          if [ "$nxdomain" -gt 0 ]; then
            echo "Run 'python scripts/check_captured.py' locally to confirm and clean up."
          fi
          # Informational only — never fails the build. A single DNS query from
          # a CI runner is not reliable enough to gate merges on; false positives
          # from transient network issues or resolver throttling are common.