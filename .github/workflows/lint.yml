name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tldextract pytest

      - name: Run tests
        working-directory: scripts
        run: pytest test_main.py -v

      - name: Check captured for dead domains
        run: |
          echo "Checking DNS resolution for domains in captured..."
          dead=0
          while IFS= read -r domain || [[ -n "$domain" ]]; do
            [[ -z "$domain" || "$domain" == \#* ]] && continue
            if ! host "$domain" 1.1.1.1 > /dev/null 2>&1; then
              echo "NXDOMAIN: $domain"
              dead=$((dead + 1))
            fi
          done < captured
          if [ "$dead" -gt 0 ]; then
            echo ""
            echo "⚠️  $dead dead domain(s) found in captured."
            echo "Review and remove them to keep the list clean."
            exit 1
          fi
          echo "All domains resolved successfully."